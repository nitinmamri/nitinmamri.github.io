<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nitin Mamri · Maintenance</title>
  <!-- Font & Icons (clean, modern) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b1120;  /* deep dark blue‑gray */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      /* subtle radial glow */
      background: radial-gradient(circle at 20% 30%, #13203a, #0a0f1a 80%);
    }

    .maintenance-card {
      max-width: 760px;
      width: 100%;
      background: rgba(18, 28, 46, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 3.5rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
      transition: all 0.2s ease;
      text-align: center;
      color: #eef2f8;
    }

    /* ----- LOGO area (big & shiny) ----- */
    .logo-wrapper {
      margin-bottom: 2.2rem;
      display: flex;
      justify-content: center;
    }

    .maintenance-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: rgba(255, 255, 255, 0.02);
      padding: 0.85rem 2.5rem 0.85rem 2rem;
      border-radius: 120px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    .logo-icon {
      font-size: 3.2rem;
      line-height: 1;
      color: #7aa9ff;
      filter: drop-shadow(0 0 12px rgba(90, 160, 255, 0.3));
      transition: transform 0.2s;
    }

    .logo-icon i {
      background: linear-gradient(145deg, #b6d4ff, #4f8eff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(60, 130, 255, 0.4);
    }

    .logo-text {
      font-weight: 700;
      font-size: 2.1rem;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #f0f5ff, #b6d0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      border-left: 2px solid rgba(255, 255, 255, 0.15);
      padding-left: 1.2rem;
      font-family: 'Inter', sans-serif;
    }

    .logo-sub {
      font-size: 0.9rem;
      font-weight: 500;
      color: #94a9d9;
      letter-spacing: 0.3px;
      background: rgba(255, 255, 255, 0.02);
      padding: 0.25rem 0.9rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      margin-left: 0.2rem;
      backdrop-filter: blur(4px);
    }

    /* ----- MAINTENANCE BADGE / TITLE ----- */
    .main-badge {
      display: inline-block;
      background: rgba(255, 200, 50, 0.08);
      border: 1px solid rgba(255, 200, 50, 0.15);
      border-radius: 60px;
      padding: 0.5rem 1.6rem;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #f5d87a;
      margin-bottom: 1.8rem;
      backdrop-filter: blur(4px);
      text-transform: uppercase;
    }

    .main-badge i {
      margin-right: 0.6rem;
      color: #f5c542;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #ffffff, #b8ceff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.1;
    }

    .sub-message {
      font-size: 1.2rem;
      font-weight: 400;
      color: #b6c8ec;
      max-width: 460px;
      margin: 0 auto 2rem;
      line-height: 1.6;
      opacity: 0.9;
    }

    .sub-message i {
      color: #7aa9ff;
      margin: 0 0.2rem;
    }

    /* ----- PROGRESS / ANIMATION BAR (fun maintenance vibe) ----- */
    .progress-wrap {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 100px;
      height: 8px;
      width: 100%;
      max-width: 360px;
      margin: 1.8rem auto 2.2rem;
      border: 1px solid rgba(255, 255, 255, 0.03);
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }

    .progress-bar {
      width: 68%;
      height: 100%;
      background: linear-gradient(90deg, #5286ff, #a7c4ff, #5286ff);
      background-size: 200% 100%;
      border-radius: 100px;
      animation: shimmer 2.8s ease-in-out infinite;
      box-shadow: 0 0 16px rgba(70, 140, 255, 0.3);
    }

    @keyframes shimmer {
      0% { background-position: 0% 0; }
      50% { background-position: 100% 0; }
      100% { background-position: 0% 0; }
    }

    /* ----- mini info + social / eta ----- */
    .eta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1rem 2rem;
      margin-top: 2rem;
      font-size: 0.95rem;
      color: #9bb0dc;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 2rem;
    }

    .eta-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .eta-item i {
      font-size: 1.2rem;
      color: #5f8cff;
      width: 1.6rem;
      text-align: center;
    }

    .eta-item span {
      font-weight: 500;
      color: #d3e0ff;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.45rem 1.5rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #b6cbff;
      text-decoration: none;
      font-weight: 500;
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }

    .github-link i {
      font-size: 1.2rem;
      color: #aac2ff;
    }

    .github-link:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.15);
      color: white;
      transform: scale(1.02);
    }

    /* footer tiny */
    .footer-note {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: #4f6797;
      letter-spacing: 0.3px;
      border-top: 1px solid rgba(255, 255, 255, 0.02);
      padding-top: 1.5rem;
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .footer-note i {
      color: #4f7ac9;
      margin-right: 0.2rem;
    }

    .footer-note a {
      color: #6889cf;
      text-decoration: none;
      border-bottom: 1px dotted rgba(255, 255, 255, 0.1);
    }

    .footer-note a:hover {
      color: #b0ccff;
      border-bottom-color: #5f8cff;
    }

    /* responsive */
    @media (max-width: 520px) {
      .maintenance-card {
        padding: 2rem 1.5rem;
        border-radius: 2.5rem;
      }
      .logo-text {
        font-size: 1.5rem;
        padding-left: 0.8rem;
      }
      .logo-icon {
        font-size: 2.6rem;
      }
      .logo-wrapper {
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 2rem;
      }
      .sub-message {
        font-size: 1rem;
      }
      .maintenance-logo {
        padding: 0.6rem 1.2rem 0.6rem 1rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .logo-sub {
        margin-left: 0;
        margin-top: 0.2rem;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

<div class="maintenance-card">

  <!-- ========== MAINTENANCE LOGO (big & clear) ========== -->
  <div class="logo-wrapper">
    <div class="maintenance-logo">
      <span class="logo-icon">
        <i class="fas fa-tools"></i>
      </span>
      <span class="logo-text">nitinmamri</span>
      <span class="logo-sub"><i class="fas fa-cog fa-fw fa-spin" style="margin-right: 4px;"></i> .io</span>
    </div>
  </div>

  <!-- maintenance badge -->
  <div class="main-badge">
    <i class="fas fa-clock"></i> scheduled maintenance
  </div>

  <!-- primary message -->
  <h1>We’ll be back soon</h1>
  <div class="sub-message">
    <i class="fas fa-code"></i> 
    <span style="font-weight: 500;">nitinmamri.github.io</span> 
    is currently under a <strong>maintenance</strong> glow-up. 
    <i class="fas fa-rocket" style="margin-left: 0.3rem;"></i>
  </div>

  <!-- maintenance progress bar (animated) -->
  <div class="progress-wrap">
    <div class="progress-bar"></div>
  </div>

  <!-- extra info: ETA + link -->
  <div class="eta-row">
    <div class="eta-item">
      <i class="fas fa-hourglass-half"></i>
      <span>~ 2 hours</span>
    </div>
    <div class="eta-item">
      <i class="fas fa-calendar-alt"></i>
      <span>today, 6 Aug 2026</span>
    </div>
    <a href="#" class="github-link" onclick="event.preventDefault();">
      <i class="fab fa-github"></i> nitinmamri
    </a>
  </div>

  <!-- footer / extra -->
  <div class="footer-note">
    <span><i class="fas fa-sync-alt fa-fw fa-spin"></i> maintenance mode</span>
    <span><i class="fas fa-shield-alt"></i> secure</span>
    <span><i class="fas fa-envelope"></i> <a href="#">contact</a></span>
  </div>

  <!-- small extra: "nitinmamri.github.io" visible as a subtle brand -->
  <div style="margin-top: 1.2rem; font-size: 0.7rem; letter-spacing: 0.8px; color: #384e7a; border-top: 1px solid rgba(255,255,255,0.02); padding-top: 1rem;">
    <i class="fas fa-circle" style="color: #5f8cff; font-size: 0.4rem; vertical-align: middle; margin-right: 6px;"></i>
    nitinmamri.github.io · under maintenance
  </div>
</div>

</body>
</html>
